name: Sync lake

# The full ingest: teams, players, gameweeks, fixtures, rules, odds, and player
# gameweek histories. Daily rather than hourly because player history is roughly
# one request per player behind a deliberate throttle, and because prices only
# move once a day.
on:
  schedule:
    # 02:15 UTC, after FPL's overnight price changes have settled.
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma separated source names (default: all but spatial-sofascore)'
        required: false
        type: string

concurrency:
  group: fpl-lake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Player history is hundreds of throttled requests; the default 360 minutes
    # would let a stuck run hold the single writer lock all day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # No version pin here: package.json packageManager owns it, and setting
      # both makes this action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # --skip-unplayed drops the request for every player with no minutes,
      # which early in a season is most of them. --continue-on-error keeps one
      # upstream having a bad morning from costing the other datasets.
      # A source that fails must not discard the snapshots the others already
      # wrote: the commit step below runs either way, and the job is failed at
      # the end instead. Without this, one upstream having a bad morning throws
      # away a completed bootstrap, fixtures, and player history run.
      - name: Sync
        id: sync
        continue-on-error: true
        run: |
          node apps/cli/dist/bin.js sync \
            --skip-unplayed \
            --continue-on-error \
            ${SOURCES:+--sources "$SOURCES"}
        env:
          SOURCES: ${{ inputs.sources }}

      # The official record for this season only. A match played yesterday
      # gains its referee, its teamsheets, and its timeline here, which is
      # everything the match centre prints that FPL does not carry. Bounded to
      # one season of each so the daily cost stays at roughly the number of
      # matches actually played since the last run.
      - name: Refresh the official record
        id: official
        continue-on-error: true
        run: node apps/cli/dist/bin.js official matches --seasons 1 --detail-seasons 1

      - name: Commit the new snapshots
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "lake unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): daily sync"
          git push || (git pull --rebase && git push)

      - name: Fail the job if a source failed
        if: steps.sync.outcome == 'failure' || steps.official.outcome == 'failure'
        run: |
          echo "a source failed; whatever landed has been committed above"
          exit 1
