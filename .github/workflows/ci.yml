name: CI

on:
  push:
    branches: [main]
    # The scheduled lake workflows commit snapshots and nothing else; re-running
    # lint and tests over a data only commit proves nothing.
    paths-ignore:
      - 'data/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
